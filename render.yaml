services:
  - type: web
    name: warren-quote-tool-hosted
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run db:migrate && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: warren-quote-tool-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: WARREN_ADMIN_EMAILS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: RESEND_REPLY_TO
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_PAYMENT_LINK
        value: "https://buy.stripe.com/14A4gz4Tt67x0recAZfMA0W"

databases:
  - name: warren-quote-tool-db
    plan: basic-256mb
